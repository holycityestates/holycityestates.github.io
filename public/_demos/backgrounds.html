<!doctype html>
<!-- TEMPORARY comparison page for background ideas. Not linked from the site; delete after Aryeh chooses. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Background options</title>
<style>
  :root { --night: #101217; --gold: #c9a862; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--night); font: 14px/1.4 system-ui, -apple-system, sans-serif; color: #eee9df; }
  .bar { height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid #000; }
  .bar b { font: 600 15px Georgia, serif; color: var(--gold); margin-inline-end: 6px; white-space: nowrap; }
  .seg { display: inline-flex; padding: 3px; gap: 3px; background: #1b1e24; border: 1px solid #2c3037; border-radius: 99px; }
  .seg button { border: 0; background: transparent; color: #a9a397; padding: 7px 16px; border-radius: 99px; font: 500 13px system-ui, sans-serif; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--gold); color: #121419; font-weight: 600; }
  .desc { color: #a9a397; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  iframe { display: block; width: 100%; height: calc(100% - 56px); border: 0; background: #fff; }
  @media (max-width: 700px) { .desc { display: none; } .bar b { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <b>Background</b>
  <div class="seg" role="group" aria-label="Background option">
    <button type="button" data-v="current" aria-pressed="false">Current</button>
    <button type="button" data-v="a" aria-pressed="true">A · Light + gold glow</button>
    <button type="button" data-v="b" aria-pressed="false">B · Light &amp; midnight bands</button>
  </div>
  <span class="desc" id="desc"></span>
</div>
<iframe id="site" src="/" title="Website preview"></iframe>

<script>
// Motifs are built here as small inline SVGs; nothing is loaded from elsewhere.
const svg = (w, h, body) => `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}' viewBox='0 0 ${w} ${h}'>${body}</svg>`)}")`;

// Limestone: a fine, seamless grain. Broad tonal variation comes from soft gradients per section instead.
const stone = svg(240, 240, `
  <filter id='g' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' seed='3' stitchTiles='stitch'/>
    <feColorMatrix values='0 0 0 0 .42  0 0 0 0 .33  0 0 0 0 .2  0 0 0 .7 0'/></filter>
  <rect width='240' height='240' filter='url(#g)' opacity='.3'/>`);
const sun = 'radial-gradient(70% 55% at 15% 0%, rgba(255,250,240,.75), transparent 70%), radial-gradient(60% 50% at 90% 100%, rgba(176,140,84,.10), transparent 70%)';
const ashlar = svg(300, 120, `<g fill='none' stroke='#8a6a2e' stroke-opacity='.10'><path d='M0 .5H300M0 60.5H300M.5 0V60M150.5 0V60M75.5 60V120M225.5 60V120'/></g>`);

// Ancient floor mosaic border: three rows of tesserae, stone / terracotta-and-gold stepped triangles / stone.
const mosaic = (() => {
  const t = 5, g = 1.2, cols = 16, pal = ['#d8c9ad', '#cfbf9f', '#dcd0b8'];
  let r = '';
  for (let c = 0; c < cols; c++) {
    const step = [0, 1, 2, 1][c % 4];
    for (let row = 0; row < 3; row++) {
      const inTri = row >= 2 - step;
      const fill = row === 1 || inTri ? (c % 8 < 4 ? '#b5654a' : '#a8853f') : pal[(c + row) % 3];
      const op = row === 1 || inTri ? .78 : .9;
      r += `<rect x='${(c * (t + g)).toFixed(1)}' y='${(row * (t + g)).toFixed(1)}' width='${t}' height='${t}' rx='.6' fill='${fill}' fill-opacity='${op}'/>`;
    }
  }
  return { url: svg(+(cols * (t + g)).toFixed(1), +(3 * (t + g) - g).toFixed(1), r), w: +(cols * (t + g)).toFixed(1), h: +(3 * (t + g) - g).toFixed(1) };
})();

// Old City wall battlements: pointed merlons, in the dark band's own colour.
const wall = (fill) => svg(30, 16, `<path d='M0 16V6L8 0L16 6V9H30V16Z' fill='${fill}'/>`);

// Armenian ceramic tile: eight-point stars at the corners, a pomegranate in the middle, fine leaves between.
const tile = svg(132, 132, `<g fill='none' stroke='#2F4C7A' stroke-opacity='.11' stroke-width='1.1' stroke-linejoin='round'>
  ${[[0, 0], [132, 0], [0, 132], [132, 132]].map(([x, y]) => `<g transform='translate(${x} ${y})'><rect x='-11' y='-11' width='22' height='22'/><rect x='-11' y='-11' width='22' height='22' transform='rotate(45)'/><circle r='4'/></g>`).join('')}
  <g transform='translate(66 70)'><circle r='12'/><path d='M-5 -11L-4 -18L-1 -13L0 -19L1 -13L4 -18L5 -11'/><path d='M-6 2C-3 6 3 6 6 2M0 -5V5'/></g>
  <g transform='translate(66 0)'><path d='M0 4C6 12 6 22 0 30C-6 22 -6 12 0 4Z'/></g><g transform='translate(66 132) rotate(180)'><path d='M0 4C6 12 6 22 0 30C-6 22 -6 12 0 4Z'/></g>
  <g transform='translate(0 66) rotate(-90)'><path d='M0 4C6 12 6 22 0 30C-6 22 -6 12 0 4Z'/></g><g transform='translate(132 66) rotate(90)'><path d='M0 4C6 12 6 22 0 30C-6 22 -6 12 0 4Z'/></g>
  <circle cx='33' cy='33' r='1.6'/><circle cx='99' cy='33' r='1.6'/><circle cx='33' cy='99' r='1.6'/><circle cx='99' cy='99' r='1.6'/></g>`);
const starOrn = svg(60, 22, `<g fill='none' stroke-width='1.2'><path d='M0 11H18M42 11H60' stroke='#a8853f'/><g transform='translate(30 11)' stroke='#a8853f'><rect x='-6.5' y='-6.5' width='13' height='13'/><rect x='-6.5' y='-6.5' width='13' height='13' transform='rotate(45)'/></g><circle cx='30' cy='11' r='2.4' fill='#2F4C7A' fill-opacity='.55' stroke='none'/></g>`);

// Shared dark palette: the site's own colour tokens, switched to night.
const DARK = `
  :root, html[data-theme] { --bg: #0D0F13; --tint: #14171D; --line: #262A31; --ink: #F1ECE2; --ink-2: #C4BDB0; --muted: #8E887C;
    --gold: #C9A862; --gold-2: #DCC084; --gold-dark: #DCC084; --night: #08090C; color-scheme: dark; }
  body { background: var(--bg); color: var(--ink); }
  .site-header:not(.transparent), .site-header.scrolled { background: rgba(13,15,19,.86) !important; border-bottom-color: rgba(201,168,98,.18); backdrop-filter: blur(14px); }
  .main-nav a:not(.btn) { color: var(--ink-2); }
  .main-nav a.active:not(.btn), .main-nav a:not(.btn):hover { color: var(--ink); }
  @media (max-width: 820px) { .main-nav { background: var(--bg); } .main-nav a:not(.btn) { color: var(--ink) !important; } }
  .chip-light { background: rgba(13,15,19,.72); color: var(--gold-2); border: 1px solid rgba(201,168,98,.35); backdrop-filter: blur(6px); }
  .filters select, .seg, .contact-card, .quote { background: var(--tint); color: var(--ink); border-color: var(--line); }
  .seg input:checked + span, .seg button[aria-pressed='true'] { background: var(--gold); color: #0D0F13; }
  .btn-outline { border-color: var(--ink-2); color: var(--ink); } .btn-outline:hover { background: var(--ink); color: var(--bg); }
  .card-price { border-top-color: var(--line); }
  .card-media { background: var(--tint); box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .facts, .facts li { border-color: var(--line); }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) sepia(.25); }
  .site-footer { border-top: 1px solid rgba(201,168,98,.18); }
`;
const goldDust = svg(200, 200, `<filter id='d' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' seed='9' stitchTiles='stitch'/>
  <feColorMatrix values='0 0 0 0 .86  0 0 0 0 .72  0 0 0 0 .44  0 0 0 4 -3.2'/></filter><rect width='200' height='200' filter='url(#d)' opacity='.5'/>`);

// The gold light: a fixed-to-viewport radial glow at the pointer. Using background-attachment: fixed on each
// section keeps it lined up with the cursor on light and dark sections alike. Smaller and stronger than before.
const glow = (a) => `radial-gradient(300px circle at var(--sx, -999px) var(--sy, -999px), rgba(201,168,98,${a}), rgba(201,168,98,${(a * .35).toFixed(3)}) 42%, transparent 72%)`;
const midnight = `--bg: #0D0F13; --tint: #14171D; --line: #262A31; --ink: #F1ECE2; --ink-2: #C4BDB0; --muted: #8E887C; --gold-2: #DCC084; --gold-dark: #DCC084;`;
const hair = `main > section + section:not(.duo) { border-top: 1px solid transparent; border-image: linear-gradient(90deg, transparent, rgba(168,133,63,.45), transparent) 1; }`;

const CSS = {
  current: '',
  a: `
    body { background: ${glow(.44)} fixed, var(--bg); }
    .section-tint:not(:has(.projects)) { background: ${glow(.44)} fixed, var(--tint); }
    .section-tint:has(.projects) { background: ${glow(.3)} fixed, var(--night); }
    ${hair}
  `,
  b: `
    body { background: ${glow(.44)} fixed, var(--bg); }
    /* every tinted band becomes midnight; text colours switch with it */
    .section-tint { ${midnight} color: var(--ink); }
    .section-tint { background: ${glow(.32)} fixed, ${goldDust}, #0D0F13 !important; background-size: auto, 200px 200px, auto !important; }
    .section-tint .quote, .section-tint .contact-card { background: #14171D; }
    .section-tint .chip-light { background: rgba(13,15,19,.72); color: #DCC084; border: 1px solid rgba(201,168,98,.35); }
    .section-tint .card-media { box-shadow: 0 18px 40px rgba(0,0,0,.45); }
    .section-tint .btn-outline { border-color: var(--ink-2); color: var(--ink); }
    .section-tint .service { border-color: rgba(201,168,98,.5); }
    .site-footer { background: ${glow(.28)} fixed, var(--night); }
    .duo-night::before { background: linear-gradient(180deg, rgba(8,9,12,.62) 0%, rgba(8,9,12,.3) 50%, rgba(8,9,12,.62) 100%); }
  `,
};
const DESC = {
  current: 'The site as it is now.',
  a: 'Today’s light colours, with a gold light that follows your mouse and gold lines between sections.',
  b: 'Sections alternate light and midnight; the gold light follows your mouse across both.',
};
let mode = 'a';
try { mode = sessionStorage.getItem('bg-demo') || 'a'; } catch (e) {}
const frame = document.getElementById('site');
const apply = () => {
  document.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === mode)));
  document.getElementById('desc').textContent = DESC[mode];
  const doc = frame.contentDocument; if (!doc || !doc.head) return;
  let st = doc.getElementById('bg-demo');
  if (!st) { st = doc.createElement('style'); st.id = 'bg-demo'; doc.head.appendChild(st); }
  st.textContent = CSS[mode];
  if (!doc.__sx) { doc.__sx = true; doc.addEventListener('pointermove', (e) => { doc.documentElement.style.setProperty('--sx', e.clientX + 'px'); doc.documentElement.style.setProperty('--sy', e.clientY + 'px'); }, { passive: true }); }
};
frame.addEventListener('load', apply);
document.querySelectorAll('[data-v]').forEach((b) => b.addEventListener('click', () => { mode = b.dataset.v; try { sessionStorage.setItem('bg-demo', mode); } catch (e) {} apply(); }));
apply();
</script>
</body>
</html>
